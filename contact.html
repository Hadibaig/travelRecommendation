<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css">
<title>Contact Us - TravelBloom</title>
</head>
<body>
<nav class="navbar">
<a class="brand" href="travel_recommendation.html"><i class="fa-solid fa-earth-americas"></i>TravelBloom</a>
<ul class="links"><li><a href="travel_recommendation.html">Home</a></li><li><a href="about.html">About Us</a></li><li><a href="contact.html">Contact Us</a></li></ul>
<span></span>
</nav>
<div class="social"><a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a><a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a><a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a></div>
<main class="contact">
<div><h1>Contact Us</h1><p class="intro">Get in touch. Email: hello@travelbloom.example</p></div>
<form id="contactForm">
<label for="name">Name</label><input type="text" id="name" placeholder="Enter your name" required>
<label for="email">Email</label><input type="email" id="email" placeholder="Enter your email" required>
<label for="message">Message</label><textarea id="message" placeholder="Enter your message" required></textarea>
<button type="submit">Submit</button>
<p id="formMsg" class="msg" style="display:none;margin-top:12px">Thanks! Your message has been sent.</p>
</form>
</main>
<script>
document.getElementById('contactForm').addEventListener('submit',function(e){
  e.preventDefault();
  document.getElementById('formMsg').style.display='inline-block';
  this.reset();
});
</script>
</body>
</html>
